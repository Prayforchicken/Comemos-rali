# Compila la APK de Android en los servidores de GitHub (no hace falta Android Studio)
# y la publica en la pestaña "Releases" del repositorio.
# Mientras viva como rama "adrian" dentro de Comemos-rali, compila con cada push a esa rama.
# Si pasa a su propio repositorio, compila con cada push a main.
name: APK Adrián

on:
  push:
    branches: [main, adrian]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-adrian
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # El runner de GitHub ya trae el SDK de Android instalado (variable ANDROID_HOME).
      # No usamos android-actions/setup-android@v3: esa acción está descontinuada y
      # falla en los runners actuales; solo hace falta aceptar las licencias.
      - name: Aceptar licencias del SDK de Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null

      - name: Instalar dependencias
        run: npm ci

      - name: Probar la lógica
        run: npm test

      - name: Compilar la web
        run: npm run build

      - name: Preparar el proyecto Android
        run: bash scripts/preparar-android.sh

      - name: Firma fija (para poder actualizar sin desinstalar)
        run: mkdir -p ~/.android && cp firma/debug.keystore ~/.android/debug.keystore

      - name: Compilar la APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Renombrar
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ComemosAdrian-0.1.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk-adrian
          path: ComemosAdrian-*.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: adrian-apk-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Comemos Adrián 0.1.${{ github.run_number }}
          make_latest: ${{ github.ref_name == 'main' }}
          body: |
            Descarga el archivo `.apk` desde el móvil e instálalo.
            La primera vez Android pedirá permiso para instalar apps de esta fuente.
          files: ComemosAdrian-*.apk
