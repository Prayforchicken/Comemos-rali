# Compila la APK de Android en los servidores de GitHub (no hace falta Android Studio)
# y la publica en la pestaña "Releases" del repositorio.
name: APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar la web
        run: npm run build

      - name: Preparar el proyecto Android
        run: bash scripts/preparar-android.sh

      - name: Firma fija (para poder actualizar sin desinstalar)
        run: mkdir -p ~/.android && cp firma/debug.keystore ~/.android/debug.keystore

      - name: Compilar la APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Renombrar
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ComemosRali-0.1.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ComemosRali-*.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Comemos Rali 0.1.${{ github.run_number }}
          make_latest: true
          body: |
            Descarga el archivo `.apk` desde el móvil e instálalo.
            La primera vez Android pedirá permiso para instalar apps de esta fuente.
          files: ComemosRali-*.apk
